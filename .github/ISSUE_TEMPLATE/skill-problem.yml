name: Skill problem
description: An agent using a skill did the wrong thing, or the skill did not trigger.
labels: ["skill"]
body:
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: "Claude Code 2.1, Opus"
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: What you asked
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: What happened and what you expected
    validations:
      required: true
