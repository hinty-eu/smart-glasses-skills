name: Links

# Runs on a schedule instead of on every pull request, so a vendor site being down for an hour does not block work.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        # The excluded hosts answer 403 to automated clients or to GitHub runner addresses (npm, Cloudflare
        # and Akamai bot walls) while the pages open fine in a browser. They were checked by hand on 2026-11-15.
        # Keep lychee's default user agent: Meta's developer docs answer 400 to a browser user agent sent by a bot.
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            --exclude "^https://www\.npmjs\.com/"
            --exclude "^https://(www\.)?cpsc\.gov/"
            --exclude "^https://www\.neowin\.net/"
            --exclude "^https://gizmodo\.com/"
            --exclude-path LICENSE --exclude-path LICENSE-DATA
            "**/*.md" data/platforms.json
          fail: false
      - name: Open an issue when links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@e8ef132d6df98ed982188e460ebb3b5d4ef3a9cd # v5.0.1
        with:
          title: Broken links found by the weekly check
          content-filepath: ./lychee/out.md
          labels: links
